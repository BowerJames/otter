# "Coding without comments": docstrings are banned in */src/*.py because they
# tend to go stale when code is updated. This rule set ERRORS whenever a module-,
# class-, or function/method-level docstring is present.
#
# Run:  just semgrep-rules
#   or:  uv run semgrep scan --config semgrep.yml --error .
rules:
  - id: no-module-docstring
    languages: [python]
    severity: ERROR
    message: "Module-level docstrings are banned (coding without comments)."
    paths:
      include: ["**/src/**/*.py"]
      exclude: ["**/.mypy_cache/**", "**/.venv/**", "**/build/**", "**/dist/**"]
    # A module docstring is a triple-quoted string as the first statement of the
    # file (optional leading blank lines / comments allowed).
    pattern-regex: '\A\s*(?:#[^\n]*\s*)*"""'

  - id: no-class-docstring
    languages: [python]
    severity: ERROR
    message: "Class docstrings are banned (coding without comments)."
    paths:
      include: ["**/src/**/*.py"]
      exclude: ["**/.mypy_cache/**", "**/.venv/**", "**/build/**", "**/dist/**"]
    # Matches a class header (`class Name`, `class Name(Bases)`, or PEP 695
    # `class Name[TypeParams]`, incl. multi-line bases) whose first body statement
    # is a triple-quoted string (blank/comment lines between header and docstring
    # allowed). `pattern-regex` is used instead of a string-literal pattern
    # because the latter would false-positive on enum members like `User = "user"`.
    pattern-regex: '^[ \t]*class[ \t]+[A-Za-z_]\w*[ \t]*(?:\[[^\]]*\])?[ \t]*(?:\([^)]*\))?[ \t]*:[ \t]*(?:#[^\n]*)?\n(?:[ \t]*(?:#[^\n]*)?\n)*[ \t]*"""'

  - id: no-function-docstring
    languages: [python]
    severity: ERROR
    message: "Function/method docstrings are banned (coding without comments)."
    paths:
      include: ["**/src/**/*.py"]
      exclude: ["**/.mypy_cache/**", "**/.venv/**", "**/build/**", "**/dist/**"]
    # Matches a function/method header (`def`/`async def`, PEP 695 generics,
    # multi-line parameters via `[^)]*`, and multi-line return annotations via
    # the closing-bracket continuation clause) whose first body statement is a
    # triple-quoted string. See the class rule comment re: `pattern-regex`.
    pattern-regex: '^[ \t]*(?:async[ \t]+)?def[ \t]+[A-Za-z_]\w*[ \t]*(?:\[[^\]]*\])?[ \t]*\([^)]*\)(?:[ \t]*->[ \t]*[^:\n]*(?:\n[ \t\])]+[^:\n]*)*)?[ \t]*:[ \t]*(?:#[^\n]*)?\n(?:[ \t]*(?:#[^\n]*)?\n)*[ \t]*"""'
