[project]
name = "otter-ai-agent"
dynamic = ["version"]
description = "Agent loop over a ModelSession — the turn FSM + tool-execution + steering/follow-up layer that wraps otter-ai-core's reactive model session"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "otter-ai-core",
]

[tool.uv.sources]
otter-ai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otter_ai_agent"]

# Version is derived from src/otter_ai_agent/__init__.py
# (single source of truth).
[tool.hatch.version]
path = "src/otter_ai_agent/__init__.py"
