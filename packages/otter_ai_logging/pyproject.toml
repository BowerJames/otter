[project]
name = "otter-ai-logging"
dynamic = ["version"]
description = "Otter AI logging: stdlib logging configured for the monorepo's UTC format + stdout/stderr routing conventions"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otter_ai_logging"]

# Version is derived from src/otter_ai_logging/__init__.py (single source of truth).
[tool.hatch.version]
path = "src/otter_ai_logging/__init__.py"
