[project]
name = "otter"
version = "0.1.0"
description = "A lightweight framework for building AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.1",
    "openai[realtime]>=3.24.0",
]

[project.optional-dependencies]
# What the terminal chat needs: Textual to draw it, and python-dotenv for its startup code.
tui = [
    "python-dotenv>=1.2.4",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.9",
    "textual>=8.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration and end-to-end tests reach real resources: run them with `just test-all`.
addopts = "-ra --strict-markers --strict-config -m 'not integration and not e2e'"
markers = [
    "integration: verifies an adapter against the resource it reaches",
    "e2e: runs the startup code with the production factories",
]
# asyncio_mode=auto: async test functions run without needing @pytest.mark.asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".agents", ".claude", ".pi"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "TID",   # banned imports: each constructor is called only where it may be
    "ASYNC", # async correctness
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["otter"]

# A module's constructor is called only by its module factories, and an adapter's only by
# its adapter factories: everything else gets the entity from a factory. Tests construct
# the entity under test themselves.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"otter.core.agent_session.AgentSessionImpl".msg = "get an AgentSession from its module factory"
"otter.core.chat.ChatImpl".msg = "get a Chat from its module factory"
"otter.core.model.ModelImpl".msg = "get a Model from its module factory"
"otter.core.session_log.SessionLogImpl".msg = "get a SessionLog from its module factory"
"otter.infrastructure.adapters.agent_session.plugin_host.PluginHostAdapter".msg = "get it from its adapter factory"
"otter.infrastructure.adapters.chat.textual.TextualAdapter".msg = "get it from its adapter factory"
"otter.infrastructure.adapters.model.openai_chat_completions.OpenAIChatCompletionsAdapter".msg = "get it from its adapter factory"
"otter.infrastructure.adapters.model.openai_realtime.OpenAIRealtimeAdapter".msg = "get it from its adapter factory"
"otter.infrastructure.adapters.model.openai_responses.OpenAIResponsesAdapter".msg = "get it from its adapter factory"
"otter.infrastructure.adapters.session_log.in_memory.InMemoryAdapter".msg = "get it from its adapter factory"
"otter.infrastructure.adapters.session_log.local_file.LocalFileAdapter".msg = "get it from its adapter factory"

[tool.ruff.lint.per-file-ignores]
"src/otter/infrastructure/factories/**" = ["TID251"]
"tests/**" = ["TID251"]

# The import rules of the project structure: inward to the core, no module importing
# another, no adapter importing another, and nothing in the core from outside the language.
[tool.importlinter]
root_package = "otter"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core never imports the infrastructure"
type = "layers"
layers = ["otter.infrastructure", "otter.core"]

[[tool.importlinter.contracts]]
name = "The domain package imports nothing"
type = "forbidden"
source_modules = ["otter.core.domain"]
forbidden_modules = ["otter.core.agent_session", "otter.core.chat", "otter.core.model", "otter.core.session_log"]

[[tool.importlinter.contracts]]
name = "No module imports another"
type = "independence"
modules = ["otter.core.agent_session", "otter.core.chat", "otter.core.model", "otter.core.session_log"]

[[tool.importlinter.contracts]]
name = "The core imports no third-party library"
type = "forbidden"
source_modules = ["otter.core"]
forbidden_modules = ["dotenv", "httpx2", "openai", "pydantic", "rich", "textual"]

[[tool.importlinter.contracts]]
name = "No adapter imports another"
type = "independence"
modules = ["otter.infrastructure.adapters.*.*"]

[[tool.importlinter.contracts]]
name = "Only adapter factories import adapters"
type = "forbidden"
source_modules = ["otter.infrastructure.entrypoints", "otter.infrastructure.factories.modules"]
forbidden_modules = ["otter.infrastructure.adapters"]
allow_indirect_imports = true
