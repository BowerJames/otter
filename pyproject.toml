[project]
name = "otter"
version = "0.1.0"
description = "A lightweight framework for building AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.1",
    "openai>=3.24.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.9",
    "textual>=8.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# asyncio_mode=auto: async test functions run without needing @pytest.mark.asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".agents", ".claude", ".pi"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "ASYNC", # async correctness
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["otter"]
